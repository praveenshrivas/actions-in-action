name: Context Demo

on:
  push:
  workflow_dispatch:

jobs:

  steps-demo:

    runs-on: ubuntu-latest

    steps:

      - name: Generate Version
        id: version
        run: echo "version=1.0.0" >> "$GITHUB_OUTPUT"

      - name: Display Version
        run: echo "Application Version = ${{ steps.version.outputs.version }}"
